name: CI Pipeline

'on':
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    name: Backend Tests (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-dev.txt

      - name: Run backend test suite
        env:
          FLASK_ENV: testing
          TEST_DATABASE_URL: "sqlite:///:memory:"
          SECRET_KEY: ci-test-only-secret-key-32-chars-minimum
          JWT_SECRET_KEY: ci-test-only-jwt-secret-key-32-chars-min
        run: |
          cd backend
          pytest -v

  frontend-build:
    name: Frontend Build Check (vite)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies (clean install)
        run: |
          cd frontend
          npm ci

      - name: Run frontend automated tests
        run: |
          cd frontend
          npm test

      - name: Build frontend for production
        run: |
          cd frontend
          npm run build
