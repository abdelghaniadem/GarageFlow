apiVersion: apps/v1
kind: Deployment
metadata:
  name: garageflow-frontend
  namespace: garageflow
  labels:
    app.kubernetes.io/name: garageflow-frontend
    app.kubernetes.io/component: ui
    app.kubernetes.io/part-of: garageflow
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: garageflow-frontend
      app.kubernetes.io/component: ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: garageflow-frontend
        app.kubernetes.io/component: ui
        app.kubernetes.io/part-of: garageflow
    spec:
      containers:
        - name: frontend
          image: garageflow-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http-web
              containerPort: 80
              protocol: TCP
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
      volumes:
        - name: nginx-config
          configMap:
            name: garageflow-frontend-nginx-config
            defaultMode: 0444
