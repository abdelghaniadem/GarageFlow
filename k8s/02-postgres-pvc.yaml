apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: garageflow-postgres-pvc
  namespace: garageflow
  labels:
    app.kubernetes.io/name: garageflow-postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: garageflow
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: standard
  resources:
    requests:
      storage: 1Gi
