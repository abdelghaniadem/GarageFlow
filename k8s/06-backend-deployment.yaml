apiVersion: apps/v1
kind: Deployment
metadata:
  name: garageflow-backend
  namespace: garageflow
  labels:
    app.kubernetes.io/name: garageflow-backend
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: garageflow
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: garageflow-backend
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: garageflow-backend
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: garageflow
    spec:
      containers:
        - name: backend
          image: garageflow-backend:latest
          imagePullPolicy: IfNotPresent
          command: ["gunicorn"]
          args: ["--config", "gunicorn.conf.py", "-w", "2", "app:create_app()"]
          ports:
            - name: http-api
              containerPort: 5000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: garageflow-backend-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: garageflow-backend-secret
                  key: DATABASE_URL
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: garageflow-backend-secret
                  key: SECRET_KEY
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: garageflow-backend-secret
                  key: JWT_SECRET_KEY
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
